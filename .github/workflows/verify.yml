name: Verify

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: npm ci

      - name: Run lint and typecheck
        run: npm run lint && npm run typecheck

      - name: Run core tests
        run: npm run test:core

      - name: Run isolated D1 smoke test
        run: npm run test:d1

      - name: Run D1 recommendation integration tests
        run: npm run test:integration

      - name: Build production bundle
        run: npm run build
